svg.chart { width: 100%; height: 90px; display: block; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(76px + env(safe-area-inset-bottom, 0px)); background: var(--fg); color: var(--bg);

<script id="core">
// ===== Logika – 1:1 s Kotlin modulom core/ (Model.kt, ExerciseLibrary.kt, Timing.kt, PlanBuilder.kt, Advisor.kt) =====
const GROUPS = [["LEGS","Noge"],["BACK","Leđa"],["CHEST","Prsa"],["SHOULDERS","Ramena"],["ARMS","Ruke"],["CORE","Trup"]];
const GROUP_LABEL = Object.fromEntries(GROUPS);
const KINDS = { DUMBBELL: ["Bučice", 2.0], BARBELL: ["Šipka / trap bar", 2.5], MACHINE: ["Mašina / sajla", 5.0], BODYWEIGHT: ["Vlastita težina", 0.0] };
const GOALS = {
  STRENGTH: { label: "Snaga", repMin: 5, repMax: 8, restSets: 180, restEx: 180 },
  HYPERTROPHY: { label: "Hipertrofija", repMin: 8, repMax: 12, restSets: 90, restEx: 120 },
};
const TIMED_MIN_SEC = 20, TIMED_MAX_SEC = 45, SETS = 3, WARMUP_MIN = 5, SEC_PER_REP = 4;
const DURATIONS = [30, 45, 60, 75, 90];
const REST_SET_OPTIONS = [60, 90, 120, 150, 180, 240];
const REST_EX_OPTIONS = [60, 90, 120, 180, 240];

const E = (id, name, group, kind, timed = false) => ({ id, name, group, kind, timed });
const LIBRARY = [
  E("back_squat","Čučanj – šipka","LEGS","BARBELL"), E("trap_bar_deadlift","Mrtvo dizanje – trap bar","LEGS","BARBELL"),
  E("rdl_barbell","Rumunjsko mrtvo dizanje – šipka","LEGS","BARBELL"), E("goblet_squat","Goblet čučanj – bučica","LEGS","DUMBBELL"),
  E("lunge_db","Iskorak – bučice","LEGS","DUMBBELL"), E("step_up_db","Penjanje na klupu – bučice","LEGS","DUMBBELL"),
  E("rdl_db","Rumunjsko mrtvo dizanje – bučice","LEGS","DUMBBELL"), E("calf_raise_db","Podizanje na prste – bučica","LEGS","DUMBBELL"),
  E("lat_pulldown","Lat mašina – povlačenje ispred","BACK","MACHINE"), E("lat_pulldown_close","Lat mašina – uski hvat","BACK","MACHINE"),
  E("cable_row","Veslanje na sajli – sjedeće","BACK","MACHINE"), E("db_row","Jednoručno veslanje – bučica","BACK","DUMBBELL"),
  E("barbell_row","Pretklonjeno veslanje – šipka","BACK","BARBELL"),
  E("bench_press","Potisak s klupe – šipka","CHEST","BARBELL"), E("db_bench_press","Potisak s klupe – bučice","CHEST","DUMBBELL"),
  E("incline_db_press","Kosi potisak – bučice","CHEST","DUMBBELL"), E("push_up","Sklek","CHEST","BODYWEIGHT"),
  E("db_shoulder_press","Potisak bučica iznad glave","SHOULDERS","DUMBBELL"), E("barbell_ohp","Potisak šipke iznad glave","SHOULDERS","BARBELL"),
  E("lateral_raise","Odručenje u stranu – bučice","SHOULDERS","DUMBBELL"), E("face_pull","Face pull – sajla","SHOULDERS","MACHINE"),
  E("db_curl","Pregib bučicama – biceps","ARMS","DUMBBELL"), E("hammer_curl","Čekić pregib – bučice","ARMS","DUMBBELL"),
  E("barbell_curl","Pregib šipkom – biceps","ARMS","BARBELL"), E("triceps_pushdown","Triceps potisak – sajla","ARMS","MACHINE"),
  E("db_triceps_ext","Francuski potisak – bučica","ARMS","DUMBBELL"),
  E("plank","Prednji upor (plank)","CORE","BODYWEIGHT",true), E("side_plank","Bočni upor","CORE","BODYWEIGHT",true),
  E("pallof_press","Pallof potisak – sajla","CORE","MACHINE"), E("dead_bug","Dead bug","CORE","BODYWEIGHT"),
  E("farmer_carry","Farmerovo nošenje – bučice","CORE","DUMBBELL",true),
];
const catalog = (custom) => { const all = LIBRARY.concat(custom || []); const by = Object.fromEntries(all.map(e => [e.id, e])); return { all, get: id => by[id] }; };

function kg(v) { return Number.isInteger(v) ? String(v) : v.toFixed(2).replace(/0+$/, "").replace(/\.$/, "").replace(".", ","); }
function restLabel(sec) { if (sec < 60) return sec + " s"; if (sec % 60 === 0) return (sec / 60) + " min"; return Math.floor(sec / 60) + ":" + String(sec % 60).padStart(2, "0") + " min"; }

const Timing = {
  workSeconds(ex, goal) { if (!ex) return Math.max(TIMED_MAX_SEC, goal.repMax * SEC_PER_REP); return ex.timed ? TIMED_MAX_SEC : goal.repMax * SEC_PER_REP; },
  exerciseSeconds(ex, goal, restSets) { return SETS * this.workSeconds(ex, goal) + (SETS - 1) * restSets; },
  workoutMinutes(exs, goal, restSets, restEx) {
    if (!exs.length) return WARMUP_MIN;
    const sec = exs.reduce((s, e) => s + this.exerciseSeconds(e, goal, restSets), 0) + (exs.length - 1) * restEx;
    return WARMUP_MIN + Math.floor((sec + 59) / 60);
  },
  capacity(minutes, goal, restSets, restEx) {
    const available = (minutes - WARMUP_MIN) * 60;
    const per = this.exerciseSeconds(null, goal, restSets) + restEx;
    return Math.max(1, Math.floor((available + restEx) / per));
  },
};

const BIG = new Set(["LEGS", "BACK", "CHEST"]);
// ===== Tjedni raspored s miješanjem (samo u pregledu; prenosi se u Android nakon potvrde) =====
// Dani u tjednu u odnosu na početni datum: razmak između treninga ≥ 1 dan gdje god je moguće.
const DAY_OFFSETS = { 1: [0], 2: [0, 3], 3: [0, 2, 4], 4: [0, 1, 3, 4], 5: [0, 1, 2, 4, 5] };
// Redoslijed u treningu: velike skupine i višezglobne vježbe prije malih (ACSM 2009), trup na kraju.
const GROUP_TIER = { LEGS: 0, BACK: 0, CHEST: 0, SHOULDERS: 1, ARMS: 2, CORE: 3 };

function rng(seed) { // mulberry32 – ponovljiv slučajni niz za isti tjedan
  let a = seed >>> 0;
  return () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
}
function shuffle(list, r) { const x = list.slice(); for (let i = x.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [x[i], x[j]] = [x[j], x[i]]; } return x; }

/** Koliko puta tjedno dolazi stalna vježba: u najmanje 2 treninga (ili u svaki, ako ih je manje). */
const pinnedPerWeek = (days) => Math.min(days, 2);

/**
 * Raspored za jedan tjedan: svaki tjedan (i na „Promiješaj”) drugačiji izbor i redoslijed vježbi,
 * ali uvijek iz odabranih vježbi, najviše [capacity] po treningu (stane u trajanje).
 * Pravila: stalne vježbe u [pinnedPerWeek] treninga; velike skupine (noge, leđa, prsa) u svakom
 * treningu kad ima mjesta; ostale skupine se izmjenjuju; svaka skupina kruži kroz sve svoje vježbe;
 * ista vježba ne dolazi dva treninga zaredom ako postoji zamjena.
 */

function weekPlan(selected, daysPerWeek, capacity, seed, pinnedIds = []) {
  const days = Math.min(5, Math.max(1, daysPerWeek)), cap = Math.max(1, capacity), r = rng(seed);
  const pinSet = new Set(pinnedIds);
  const pinned = selected.filter(e => pinSet.has(e.id)), loose = selected.filter(e => !pinSet.has(e.id));
  // Stalne vježbe raspoređene ravnomjerno po danima, s pomakom da ne padnu sve na isti dan.
  const pinnedDays = Array.from({ length: days }, () => []);
  const n = pinnedPerWeek(days), base = Math.floor(r() * days);
  pinned.forEach((e, idx) => { for (let j = 0; j < n; j++) pinnedDays[(base + idx + Math.floor(j * days / n)) % days].push(e); });
  const groups = GROUPS.map(([g]) => g).filter(g => selected.some(e => e.group === g));
  const queues = Object.fromEntries(groups.map(g => [g, shuffle(loose.filter(e => e.group === g), r)]));
  const cursor = Object.fromEntries(groups.map(g => [g, 0]));
  const big = groups.filter(g => BIG.has(g)), small = shuffle(groups.filter(g => !BIG.has(g)), r);
  let smallPos = 0, prevDay = new Set();
  const weekCount = Object.fromEntries(groups.map(g => [g, 0]));
  const out = [];
  for (let d = 0; d < days; d++) {
    const today = [], used = new Set();
    const take = (g) => {
      const q = queues[g];
      for (let k = 0; k < q.length; k++) {
        const ex = q[(cursor[g] + k) % q.length];
        if (used.has(ex.id)) continue;
        if (prevDay.has(ex.id) && q.some(o => !used.has(o.id) && !prevDay.has(o.id))) continue;
        cursor[g] = (cursor[g] + k + 1) % q.length; used.add(ex.id); today.push(ex); return true;
      }
      return false;
    };
    for (const e of pinnedDays[d]) if (today.length < cap && !used.has(e.id)) { used.add(e.id); today.push(e); }
    for (const g of shuffle(big, r)) if (today.length < cap && !today.some(e => e.group === g)) take(g);
    for (let k = 0; k < small.length && today.length < cap; k++) { const g = small[(smallPos + k) % small.length]; if (!today.some(e => e.group === g)) take(g); }
    smallPos = (smallPos + Math.max(1, cap - big.length)) % Math.max(1, small.length);
    // Preostala mjesta: skupina s najmanje vježbi ovaj tjedan (najviše 2 po skupini u treningu).
    let added = true;
    while (today.length < cap && added) {
      added = false;
      const order = shuffle(groups, r).sort((x, y) => weekCount[x] - weekCount[y]);
      for (const g of order) {
        if (today.filter(e => e.group === g).length >= 2) continue;
        if (take(g)) { added = true; break; }
      }
    }
    today.forEach(e => weekCount[e.group]++);
    // Velike skupine prije malih; unutar iste razine stalne vježbe prve (dok ste svježi).
    const ordered = shuffle(today, r).sort((x, y) => GROUP_TIER[x.group] - GROUP_TIER[y.group] || pinSet.has(y.id) - pinSet.has(x.id));
    out.push(ordered.map(e => e.id));
    prevDay = used;
  }
  const usedAll = new Set(out.flat());
  // Stalne vježbe koje nisu stale (previše stalnih za trajanje) također se prijavljuju.
  return { days: out, omitted: selected.filter(e => !usedAll.has(e.id)) };
}

function workingSets(sets) {
  const ws = sets.map(s => s.weightKg).filter(w => w != null);
  if (!ws.length) return sets;
  const top = Math.max(...ws);
  return sets.filter(s => s.weightKg === top);
}

function recommend(ex, goal, history) {
  const sessions = history.filter(s => s.length);
  const min = ex.timed ? TIMED_MIN_SEC : goal.repMin, max = ex.timed ? TIMED_MAX_SEC : goal.repMax;
  const unit = ex.timed ? "s" : "ponavljanja";
  const last = sessions[sessions.length - 1];
  if (!last) return { action: "START", weightKg: null, text: `Prvi put: izaberite težinu s kojom možete ${SETS} serije po ${min}–${max} ${unit} uz dobru tehniku.` };
  const weights = last.map(s => s.weightKg).filter(w => w != null);
  const weight = weights.length ? Math.max(...weights) : null;
  const working = workingSets(last);
  const allTop = working.length >= SETS && working.every(s => s.reps >= max);
  const below = working.some(s => s.reps < min);
  const prev = sessions[sessions.length - 2];
  const prevBelow = prev ? workingSets(prev).some(s => s.reps < min) : false;
  const step = KINDS[ex.kind][1];
  if (weight == null || step === 0) {
    if (allTop) return { action: "INCREASE", weightKg: null, text: ex.timed ? `Sve serije ≥ ${max} s – produljite ili otežajte vježbu.` : `Sve serije ≥ ${max} ponavljanja – otežajte varijantu ili dodajte ponavljanja.` };
    return { action: "HOLD", weightKg: null, text: "Nastavite i pokušajte dodati ponavljanje ili sekundu." };
  }
  if (allTop) { const up = weight + step; return { action: "INCREASE", weightKg: up, text: `Sve serije na ${max} ${unit} – povećajte na ${kg(up)} kg.` }; }
  if (below && prevBelow) { const down = Math.max(0, weight - step); return { action: "DECREASE", weightKg: down, text: `Dva treninga zaredom ispod ${min} ${unit} – smanjite na ${kg(down)} kg.` }; }
  if (below) return { action: "HOLD", weightKg: weight, text: `Ispod ${min} ${unit} – ostanite na ${kg(weight)} kg i pokušajte ponovno.` };
  return { action: "HOLD", weightKg: weight, text: `Ostanite na ${kg(weight)} kg dok sve serije ne dođu do ${max} ${unit}.` };
}
</script>

const pts = (a) => a.map(p => p.join(",")).join(" ");
function poseSvg(pose, label) {
  const eq = pose.eq.map(e => {
    if (e.plate) return `<circle cx="${e.plate[0]}" cy="${e.plate[1]}" r="9" class="eq-fill"/>`;
    if (e.db) return e.v ? `<rect x="${e.db[0] - 2.5}" y="${e.db[1] - 5}" width="5" height="10" rx="1.5" class="eq-fill"/>`
                         : `<rect x="${e.db[0] - 5}" y="${e.db[1] - 2.5}" width="10" height="5" rx="1.5" class="eq-fill"/>`;
    if (e.bar) return `<rect x="${e.bar[0] - 6}" y="${e.bar[1] - 1.5}" width="12" height="3" rx="1.5" class="eq-fill"/>`;
    if (e.cable) return `<polyline points="${pts(e.cable)}" class="eq-line" ${e.dash ? 'stroke-dasharray="3 3"' : ""}/><circle cx="${e.cable[1][0]}" cy="${e.cable[1][1]}" r="2.5" class="eq-fill"/>`;
    if (e.bench) { const [x, y, w] = e.bench; return `<rect x="${x}" y="${y}" width="${w}" height="5" rx="1" class="eq-fill"/><line x1="${x + 4}" y1="${y + 5}" x2="${x + 4}" y2="92" class="eq-line"/><line x1="${x + w - 4}" y1="${y + 5}" x2="${x + w - 4}" y2="92" class="eq-line"/>`; }
    if (e.seat) { const [x, y, w] = e.seat; return `<rect x="${x}" y="${y}" width="${w}" height="5" rx="1" class="eq-fill"/><line x1="${x + w / 2}" y1="${y + 5}" x2="${x + w / 2}" y2="92" class="eq-line"/>`; }
    if (e.box) { const [x, y, w, h] = e.box; return `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="1" class="eq-box"/>`; }
    if (e.pad) return `<circle cx="${e.pad[0]}" cy="${e.pad[1]}" r="3.5" class="eq-fill"/>`;
    if (e.incline) return `<polyline points="${pts(e.incline)}" class="eq-thick"/><line x1="${e.incline[1][0]}" y1="${e.incline[1][1]}" x2="${e.incline[1][0]}" y2="92" class="eq-line"/>`;
    if (e.plateStand) return `<rect x="${e.plateStand[0]}" y="${e.plateStand[1]}" width="4" height="26" rx="1" class="eq-fill"/>`;
    return "";
  }).join("");
  return `<svg viewBox="0 -10 100 106" class="pose" role="img" aria-label="${label}">
    <line x1="2" y1="92" x2="98" y2="92" class="ground"/>
    ${eq}
    ${pose.lines.map(l => `<polyline points="${pts(l)}" class="limb"/>`).join("")}
    <circle cx="${pose.head[0]}" cy="${pose.head[1]}" r="6" class="headc"/>
  </svg>`;
}

const $ = (sel) => document.querySelector(sel);
const esc = (s) => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const today = () => Math.floor((Date.now() - new Date().getTimezoneOffset() * 60000) / 86400000);
const WD = ["ned", "pon", "uto", "sri", "čet", "pet", "sub"];

const fromIso = (v) => Math.floor(Date.parse(v + "T00:00:00Z") / 86400000);

function emptyState() {

    startDay: today(), endDay: today() + 8 * 7 - 1, bodyWeightKg: 80, salts: {}, selected: [], pinned: [], customExercises: [], sessions: [] };
}
function exampleData() {

    selected: ["trap_bar_deadlift", "back_squat", "rdl_db", "lat_pulldown", "cable_row", "db_row", "bench_press", "db_bench_press",
      "db_shoulder_press", "lateral_raise", "db_curl", "triceps_pushdown", "plank", "pallof_press"],
    pinned: ["trap_bar_deadlift", "bench_press"] });

    return { id: day * 1000 + k, epochDay: day, plannedDay: day, workoutName: `Tjedan ${w + 1} · Trening ${letter(k)}`, durationSeconds: 3300 + k * 120,
      entries: entries.map(([id, kgv, reps]) => ({ exerciseId: id, sets: reps.map(r => ({ weightKg: kgv, reps: r, workSeconds: 40 })) })) }; };
  d.sessions = [
    mk(0, 0, [["trap_bar_deadlift", 60, [10, 9, 8]], ["lat_pulldown", 45, [12, 11, 10]], ["db_shoulder_press", 12, [10, 9, 8]], ["db_curl", 10, [12, 12, 11]]]),
    mk(0, 1, [["back_squat", 50, [10, 10, 9]], ["cable_row", 40, [12, 12, 12]], ["bench_press", 45, [10, 9, 9]], ["plank", null, [40, 35, 30]]]),
    mk(1, 0, [["trap_bar_deadlift", 60, [12, 11, 10]], ["db_bench_press", 18, [11, 10, 10]], ["lat_pulldown", 45, [12, 12, 11]], ["db_curl", 10, [12, 12, 12]]]),
    mk(1, 1, [["trap_bar_deadlift", 60, [12, 12, 12]], ["db_row", 20, [12, 12, 12]], ["bench_press", 45, [11, 10, 10]], ["lateral_raise", 8, [12, 11, 10]]]),
  ];

let state = null;
function load() {
  try { const s = localStorage.getItem(STORE_KEY); if (s) { const d = JSON.parse(s); if (d.startDay == null) d.startDay = today(); d.salts = d.salts || {}; d.pinned = d.pinned || []; if (d.endDay === undefined) d.endDay = null; d.bodyWeightKg = d.bodyWeightKg || 80; return d; } } catch (e) {}
  return exampleData();
}
function persist() { try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch (e) {} }
state = load();

const goalOf = (d) => GOALS[d.goal];
const restSets = (d) => d.restSetsSec ?? goalOf(d).restSets;
const restEx = (d) => d.restExercisesSec ?? goalOf(d).restEx;
const cat = () => catalog(state.customExercises);
const capacityOf = (d) => Timing.capacity(d.durationMinutes, goalOf(d), restSets(d), restEx(d));
const weekOf = (day) => Math.floor((day - state.startDay) / 7);
const dayDate = (w, k) => state.startDay + 7 * w + DAY_OFFSETS[state.daysPerWeek][k];
// Trening je vezan uz planirani datum, pa promjena početka ili broja dana ne miješa stare treninge.
const sessionFor = (w, k) => { const day = dayDate(w, k); return state.sessions.find(s => s.plannedDay === day); };

/** Zadnji tjedan programa (null = bez kraja). */
const lastWeek = () => state.endDay == null ? null : weekOf(state.endDay);
const inProgram = (w, k) => state.endDay == null || dayDate(w, k) <= state.endDay;
const programWeeks = () => state.endDay == null ? null : lastWeek() + 1;
/** Vježbe s bučicom u svakoj ruci (jednoručno veslanje: obje strane) – podignuto je dvostruko od upisane težine. */
const TWO_DUMBBELLS = new Set(["lunge_db", "step_up_db", "rdl_db", "db_row", "db_bench_press", "incline_db_press",
  "db_shoulder_press", "lateral_raise", "db_curl", "hammer_curl"]);
const loadFactor = (ex) => ex.kind === "DUMBBELL" && (ex.pair ?? TWO_DUMBBELLS.has(ex.id)) ? 2 : 1;
/** Podignuti kilogrami: težina × ponavljanja × broj bučica (bez vježbi na vrijeme i bez vlastite težine). */
function setVolume(ex, st) { return ex && !ex.timed && st.weightKg != null ? st.weightKg * st.reps * loadFactor(ex) : 0; }
function sessionStats(sess) {
  const c = cat(); let kgSum = 0, sets = 0;
  sess.entries.forEach(e => { const ex = c.get(e.exerciseId); e.sets.forEach(st => { kgSum += setVolume(ex, st); sets++; }); });
  const min = sess.durationSeconds != null ? sess.durationSeconds / 60 : 0;
  // Procjena: 3,5 MET (2024 Adult Compendium, 02054) × tjelesna masa × sati; 1 MET ≈ 1 kcal/kg/h.
  return { kg: Math.round(kgSum), sets, min: Math.round(min), kcal: Math.round(3.5 * state.bodyWeightKg * min / 60) };
}
const fmtInt = (n) => n.toLocaleString("hr-HR");

function planForWeek(w) {
  const c = cat();
  const seed = (state.startDay * 1000003 + w * 7919 + (state.salts[w] || 0) * 104729 + state.daysPerWeek * 31 + state.durationMinutes) | 0;
  return weekPlan(state.selected.map(c.get).filter(Boolean), state.daysPerWeek, capacityOf(state), seed, state.pinned);
}
/** Sljedeći trening: današnji ako nije odrađen, inače prvi sljedeći neodrađeni. */
function nextTarget() {
  const t = today();
  for (let w = Math.max(0, weekOf(t)); w < Math.max(0, weekOf(t)) + 2; w++)
    for (let k = 0; k < state.daysPerWeek; k++) if (!sessionFor(w, k) && dayDate(w, k) >= t && inProgram(w, k)) return { w, k };
  return null;
}
function history(id) { return state.sessions.slice().sort((a, b) => a.epochDay - b.epochDay || a.id - b.id).map(s => { const e = s.entries.find(x => x.exerciseId === id); return e && e.sets.length ? [s.epochDay, e.sets] : null; }).filter(Boolean); }

const describeSets = (sets, timed) => sets.map(s => (s.weightKg != null ? kg(s.weightKg) + "×" : "") + s.reps + (timed ? "s" : "")).join("  ");

const fresh = new Set();
let ui = { tab: "home", settings: false, session: null, analysis: "weeks", week: null, editing: false, setup: null, active: null, toast: null, dialog: null };

// --- Zvuk na kraju odmora (Web Audio; radi nakon prvog dodira) ---
let audio = null;

function pinWarning(s, cap) {
  const perDay = Math.ceil(s.pinned.length * pinnedPerWeek(s.days) / s.days);
  return perDay > cap ? `<div class="card warn">Previše stalnih vježbi: u trening ih treba ~${perDay}, a stane ${cap}. Smanjite broj stalnih vježbi ili produljite trening.</div>` : "";

function planView() {

// ===== Trening: jedna vježba po ekranu =====
const entryDone = (e) => e.sets.length >= SETS;

  return null;
}

          <label class="field">kg<input id="w-${i}" inputmode="decimal" value="${defW != null ? kg(defW) : ""}"></label>
          <button class="step" data-act="stepW" data-i="${i}" data-d="${step}" aria-label="Teže">+</button></div>` : ""}
        <div class="stepper"><button class="step" data-act="stepReps" data-i="${i}" data-d="${ex.timed ? -5 : -1}" aria-label="Manje">−</button>
          <label class="field">${ex.timed ? "sekunde" : "ponavljanja"}<input id="r-${i}" inputmode="numeric" value="${defR}"></label>
          <button class="step" data-act="stepReps" data-i="${i}" data-d="${ex.timed ? 5 : 1}" aria-label="Više">+</button></div>`}`}
      ${primary}
      ${!working && !pending && !entryDone(e) ? `<button class="btn text" data-act="saveSet" data-i="${i}">Upiši seriju bez štoperice</button>` : ""}
      ${e.sets.length && !working ? `<button class="btn text" data-act="undoSet" data-i="${i}">Poništi zadnju seriju</button>` : ""}
    </section>
    <div class="wk-foot">
      <button class="btn text nav" data-act="goPrev" ${a.pos === 0 ? "disabled" : ""} aria-label="Prethodna vježba">‹</button>
      <div class="next-info">${nextEx ? `<span class="muted">Sljedeće</span><strong>${esc(nextEx.name)}</strong>${nextRec && nextRec.weightKg != null ? `<span class="muted">${kg(nextRec.weightKg)} kg</span>` : ""}`
        : `<span class="muted">${doneCount === a.order.length ? "Sve vježbe su odrađene" : "Zadnja vježba"}</span>`}</div>
      <button class="btn text nav" data-act="goNextPos" ${a.pos === a.order.length - 1 ? "disabled" : ""} aria-label="Sljedeća vježba">›</button>
    </div>
    <div class="wk-tools">
      ${!entryDone(e) && !working && nextPos != null ? `<button class="btn text" data-act="later">Sprava zauzeta – kasnije</button>` : ""}
      <button class="btn text" data-act="overview">Pregled treninga</button>
      <button class="btn text" data-act="toSummary">Završi trening</button>
    </div>`;
}
function overviewView(a) {
  const c = cat();
  return `<div class="wk-head"><span>${esc(a.name)}</span><span class="total">ukupno ${clock(Math.floor((Date.now() - a.startedAt) / 1000))}</span></div>
    <h1>Pregled treninga</h1>
    ${a.order.map((idx, p) => { const e = a.entries[idx], ex = c.get(e.exerciseId);
      return `<button class="ov-row ${p === a.pos ? "cur" : ""}" data-act="jump" data-p="${p}">
        <span>${p + 1}. ${esc(ex.name)}</span><span class="${entryDone(e) ? "status done" : "muted"}">${entryDone(e) ? "✓ " : ""}${e.sets.length}/${SETS}</span></button>`; }).join("")}
    <button class="btn secondary block" data-act="backToEx">Natrag na vježbu</button>
    <button class="btn block" data-act="toSummary">Završi trening</button>`;
}
function summaryView(a) {
  const c = cat(), g = goalOf(state), done = a.entries.filter(e => e.sets.length);
  const all = a.entries.every(entryDone);
  return `<h1>${all ? "Trening gotov" : "Završiti trening?"}</h1>
    <p class="muted">${esc(a.name)} · ${Math.floor((Date.now() - a.startedAt) / 60000)} min · ${done.reduce((n, e) => n + e.sets.length, 0)} serija</p>
    ${all ? "" : `<div class="card warn">Nisu odrađene sve serije. Spremaju se samo upisane.</div>`}
    ${done.map(e => { const ex = c.get(e.exerciseId), nr = recommend(ex, g, history(ex.id).map(h => h[1]).concat([e.sets]));
      return `<section class="card"><h3>${esc(ex.name)}</h3><p class="set-log">${describeSets(e.sets, ex.timed)}</p>
        <p class="muted">Sljedeći put: ${esc(nr.text)}</p></section>`; }).join("")}
    <button class="btn block" data-act="saveWorkout">Spremi trening</button>
    <button class="btn secondary block" data-act="backToEx">Natrag na trening</button>
    <button class="btn text danger" data-act="cancelWorkout">Odbaci trening bez spremanja</button>`;
}

function chartSvg(values) {
  const W = 300, H = 90, pad = 10, min = Math.min(...values), max = Math.max(...values), span = max - min || 1;
  const pts = values.map((v, i) => [pad + i * (W - 2 * pad) / (values.length - 1), H - pad - (v - min) / span * (H - 2 * pad)]);
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true">
    <polyline fill="none" stroke="var(--accent)" stroke-width="3" vector-effect="non-scaling-stroke" points="${pts.map(p => p.join(",")).join(" ")}"></polyline>
    ${pts.map(p => `<circle cx="${p[0]}" cy="${p[1]}" r="4" fill="var(--accent)"></circle>`).join("")}</svg>`;
}

const GEAR = `<svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true"><path fill="currentColor" d="M19.4 13a7.5 7.5 0 0 0 0-2l2-1.6-2-3.4-2.4 1a7.4 7.4 0 0 0-1.7-1L15 3.4h-4l-.4 2.6a7.4 7.4 0 0 0-1.7 1l-2.4-1-2 3.4 2 1.6a7.5 7.5 0 0 0 0 2l-2 1.6 2 3.4 2.4-1a7.4 7.4 0 0 0 1.7 1l.4 2.6h4l.4-2.6a7.4 7.4 0 0 0 1.7-1l2.4 1 2-3.4-2-1.6ZM13 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7Z" transform="translate(-1 0)"/></svg>`;
function titleBar(text) {
  return `<div class="titlebar"><h1>${esc(text)}</h1><button class="gear" data-act="openSettings" aria-label="Postavke">${GEAR}</button></div>`;
}
function statLine(st) { return `${st.min} min · ${st.sets} serija · ${fmtInt(st.kg)} kg · ≈${fmtInt(st.kcal)} kcal`; }
const sortedSessions = () => state.sessions.slice().sort((a, b) => b.epochDay - a.epochDay || b.id - a.id);

function homeView() {
  const t = today(), c = cat(), g = goalOf(state), next = nextTarget(), cur = Math.max(0, weekOf(t)), last = sortedSessions()[0];
  const ended = state.endDay != null && t > state.endDay;
  const pw = programWeeks();
  let nextCard;
  if (next) {
    const ids = planForWeek(next.w).days[next.k], exs = ids.map(c.get).filter(Boolean), day = dayDate(next.w, next.k);
    nextCard = `<section class="card next"><span class="badge">${day === t ? "Danas" : "Sljedeći trening"}</span>
      <h3>${fmtShort(day)} · Tjedan ${next.w + 1} · Trening ${letter(next.k)}</h3>
      <p class="muted">~${Timing.workoutMinutes(exs, g, restSets(state), restEx(state))} min · ${exs.length} vježbi: ${exs.map(e => esc(e.name)).join(", ")}</p>
      <button class="btn block" data-act="start" data-w="${next.w}" data-k="${next.k}">${day === t ? "Započni trening" : "Započni sada"}</button></section>`;
  } else if (ended) {
    nextCard = `<section class="card"><h3>Program je završen</h3><p class="muted">${fmtDate(state.startDay)} – ${fmtDate(state.endDay)}. Postavite novi program ili produljite postojeći.</p>
      <button class="btn block" data-act="openSetup">Novi program</button></section>`;
  } else nextCard = "";
  let lastCard = `<section class="card"><h3>Posljednji trening</h3><p class="muted">Još nema odrađenih treninga.</p></section>`;
  if (last) {
    const st = sessionStats(last);
    lastCard = `<section class="card"><span class="badge">Posljednji trening</span>
      <h3>${fmtShort(last.epochDay)} · ${esc(last.workoutName)}</h3>
      <p class="muted">${statLine(st)}</p>
      ${last.entries.map(e => { const ex = c.get(e.exerciseId); if (!ex) return ""; const r = rec(ex.id);
        const tag = r && r.action === "INCREASE" ? `<span class="trend up">↑ ${r.weightKg != null ? kg(r.weightKg) + " kg" : "teže"}</span>`
          : r && r.action === "DECREASE" ? `<span class="trend down">↓ ${kg(r.weightKg)} kg</span>` : `<span class="trend">=</span>`;
        return `<div class="ex-line"><span>${esc(ex.name)} <span class="muted set-log">${describeSets(workingSets(e.sets), ex.timed)}</span></span>${tag}</div>`; }).join("")}
      <p class="muted">↑ povećati sljedeći put · = zadržati · ↓ smanjiti</p>
      <button class="btn text" data-act="openSession" data-id="${last.id}">Detalji treninga</button></section>`;
  }
  const weekDays = Array.from({ length: state.daysPerWeek }, (_, k) => k).filter(k => inProgram(cur, k));
  const weekDone = weekDays.filter(k => sessionFor(cur, k)).length;
  return `${titleBar("Početna")}
    ${state.example ? `<p class="preview-note">Pregled s primjerom podataka. Promjene ostaju samo u ovom pregledniku.</p>` : ""}
    <section class="card"><div class="ex-line"><h3>${g.label} · ${state.daysPerWeek}× tjedno</h3><span class="muted">${state.startDay > t ? "počinje " + fmtShort(state.startDay) : pw ? `tjedan ${Math.min(cur + 1, pw)} od ${pw}` : `tjedan ${cur + 1}`}</span></div>
      ${pw ? `<div class="meter"><span style="width:${Math.min(100, Math.max(0, (t - state.startDay + 1) / (pw * 7) * 100)).toFixed(0)}%"></span></div>
      <p class="muted">${fmtDate(state.startDay)} – ${fmtDate(state.endDay)}</p>` : ""}
      ${state.startDay <= t ? `<p class="muted">Ovaj tjedan: ${weekDone} od ${weekDays.length} treninga</p>` : ""}</section>
    ${nextCard}${lastCard}`;
}

function sessionsView() {
  if (ui.session != null) return sessionDetail(state.sessions.find(s => s.id === ui.session));
  const list = sortedSessions();
  return `${titleBar("Treninzi")}
    ${list.length ? "" : `<p class="muted">Još nema odrađenih treninga. Pokrenite trening na Početnoj ili u Planu.</p>`}
    ${list.map(s => { const st = sessionStats(s); return `<button class="ov-row sess" data-act="openSession" data-id="${s.id}">
      <span><strong>${fmtShort(s.epochDay)}</strong> · ${esc(s.workoutName)}<br><span class="muted">${statLine(st)}</span></span><span class="muted">›</span></button>`; }).join("")}`;
}

function sessionDetail(s) {
  if (!s) { ui.session = null; return sessionsView(); }
  const c = cat(), st = sessionStats(s);
  return `<button class="btn text" data-act="closeSession">‹ Treninzi</button>
    <h1>${fmtShort(s.epochDay)} · ${esc(s.workoutName)}</h1>
    <div class="kpis"><div><b>${st.min}</b><span>min</span></div><div><b>${st.sets}</b><span>serija</span></div><div><b>${fmtInt(st.kg)}</b><span>kg</span></div><div><b>≈${fmtInt(st.kcal)}</b><span>kcal</span></div></div>
    ${s.entries.map(e => { const ex = c.get(e.exerciseId), vol = e.sets.reduce((n, x) => n + setVolume(ex, x), 0);
      return `<section class="card"><div class="ex-line"><h3>${esc(ex?.name || e.exerciseId)}</h3><span class="kg">${vol ? fmtInt(Math.round(vol)) + " kg" : ""}</span></div>
        ${e.sets.map((x, k) => `<p class="set-log">Serija ${k + 1}: ${describeSets([x], ex?.timed)}${x.workSeconds != null ? " · rad " + clock(x.workSeconds) : ""}</p>`).join("")}</section>`; }).join("")}
    <button class="btn text danger" data-act="deleteSession" data-id="${s.id}">Obriši trening</button>`;
}

function barChart(rows) { // rows: [label, value]
  const W = 320, H = 130, pad = 22, max = Math.max(1, ...rows.map(r => r[1])), bw = (W - 8) / rows.length;
  return `<svg class="bars" viewBox="0 0 ${W} ${H}" role="img" aria-label="Kilogrami po tjednu">
    ${rows.map(([l, v], i) => { const h = v / max * (H - pad - 16), x = 4 + i * bw;
      return `<rect x="${x + bw * 0.15}" y="${H - pad - h}" width="${bw * 0.7}" height="${Math.max(h, v ? 1 : 0)}" rx="3" fill="var(--accent)"></rect>
      <text x="${x + bw / 2}" y="${H - 6}" text-anchor="middle" fill="var(--muted)" font-size="11">${l}</text>
      ${v ? `<text x="${x + bw / 2}" y="${H - pad - h - 4}" text-anchor="middle" fill="var(--fg)" font-size="10">${v >= 1000 ? (v / 1000).toFixed(1).replace(".", ",") + "t" : v}</text>` : ""}`; }).join("")}
    <line x1="0" x2="${W}" y1="${H - pad}" y2="${H - pad}" stroke="var(--line)"></line></svg>`;
}

function analysisView() {
  const mode = ui.analysis || "weeks";
  const seg = `<div class="seg" role="tablist">
    <button role="tab" aria-selected="${mode === "weeks"}" data-act="anMode" data-m="weeks">Tjedni</button>
    <button role="tab" aria-selected="${mode === "exercises"}" data-act="anMode" data-m="exercises">Vježbe</button></div>`;
  return `${titleBar("Analiza")}${seg}${state.sessions.length ? (mode === "weeks" ? weeksAnalysis() : exercisesAnalysis()) : `<p class="muted">Analiza se puni kako odrađujete treninge.</p>`}`;
}

function weeksAnalysis() {
  const t = today(), all = state.sessions.map(sessionStats);
  const tot = all.reduce((a, x) => ({ kg: a.kg + x.kg, kcal: a.kcal + x.kcal, min: a.min + x.min, sets: a.sets + x.sets }), { kg: 0, kcal: 0, min: 0, sets: 0 });
  const sw = state.sessions.map(s => weekOf(s.plannedDay ?? s.epochDay));
  const maxW = Math.max(0, weekOf(t), ...sw), minW = Math.min(0, ...sw);
  const weeks = [];
  for (let w = minW; w <= maxW; w++) {
    const ss = state.sessions.filter(s => weekOf(s.plannedDay ?? s.epochDay) === w).sort((a, b) => a.epochDay - b.epochDay);
    // Planirani dani do danas; današnji se broji tek kad je odrađen.
    const planned = Array.from({ length: state.daysPerWeek }, (_, k) => k).filter(k => inProgram(w, k) && (dayDate(w, k) < t || sessionFor(w, k))).length;
    const st = ss.map(sessionStats), sum = st.reduce((a, x) => ({ kg: a.kg + x.kg, kcal: a.kcal + x.kcal, min: a.min + x.min, sets: a.sets + x.sets }), { kg: 0, kcal: 0, min: 0, sets: 0 });
    if (w < 0 && !ss.length) continue; // prije početka programa prikazuju se samo tjedni s treninzima
    weeks.push({ w, ss, st, sum, planned });
  }
  const shown = weeks.slice(-8);
  return `<div class="kpis"><div><b>${state.sessions.length}</b><span>treninga</span></div><div><b>${fmtInt(tot.kg)}</b><span>kg ukupno</span></div>
      <div><b>${(Math.round(tot.min / 6) / 10).toLocaleString("hr-HR")}</b><span>sati</span></div><div><b>≈${fmtInt(tot.kcal)}</b><span>kcal</span></div></div>
    <section class="card"><h3>Podignuti kilogrami po tjednu</h3>${barChart(shown.map(x => [x.w < 0 ? "–" : "T" + (x.w + 1), x.sum.kg]))}</section>
    ${weeks.slice().reverse().map(x => `<section class="card">
      <div class="ex-line"><h3>${x.w < 0 ? "Prije programa" : "Tjedan " + (x.w + 1)}</h3><span class="muted">${fmtShort(state.startDay + 7 * x.w)} – ${fmtShort(state.startDay + 7 * x.w + 6)}</span></div>
      <p>${x.ss.length}${x.planned ? " od " + x.planned : ""} treninga · ${x.sum.sets} serija · <strong>${fmtInt(x.sum.kg)} kg</strong> · ${x.sum.min} min · ≈${fmtInt(x.sum.kcal)} kcal</p>
      ${x.ss.map((s, i) => `<button class="ov-row" data-act="openSessionFromAnalysis" data-id="${s.id}"><span>${fmtShort(s.epochDay)} · ${esc(s.workoutName.replace(/^Tjedan \d+ · /, ""))}</span>
        <span class="muted">${fmtInt(x.st[i].kg)} kg · ≈${x.st[i].kcal} kcal</span></button>`).join("")}
    </section>`).join("")}
    <p class="muted">Kilogrami = težina × ponavljanja; kod vježbi s dvije bučice (i jednoručnog veslanja, obje strane) računa se dvostruko. Vježbe s vlastitom težinom i na vrijeme nisu uračunate. Kalorije su gruba procjena: 3,5 MET × ${kg(state.bodyWeightKg)} kg × trajanje (2024 Adult Compendium of Physical Activities, šifra 02054).</p>`;
}

function exercisesAnalysis() {
  const c = cat();
  const ids = [...new Set(state.sessions.flatMap(s => s.entries.map(e => e.exerciseId)))];
  return ids.map(id => {
    const ex = c.get(id), h = history(id); if (!ex || !h.length) return "";
    const vals = h.map(([, sets]) => { const w = sets.map(x => x.weightKg).filter(x => x != null); return w.length ? Math.max(...w) : Math.max(...sets.map(x => x.reps)); });
    const unit = h[h.length - 1][1].some(x => x.weightKg != null) ? "kg" : ex.timed ? "s" : "pon.";
    const first = vals[0], now = vals[vals.length - 1], ch = first > 0 ? Math.round((now - first) / first * 100) : 0;
    const vol = h.reduce((n, [, sets]) => n + sets.reduce((m, x) => m + setVolume(ex, x), 0), 0);
    const r = rec(id);
    return `<section class="card"><div class="ex-line"><h3>${esc(ex.name)}</h3><span class="muted">${h.length}× · ${vol ? fmtInt(Math.round(vol)) + " kg" : ""}</span></div>
      <p>Početak ${kg(first)} ${unit} → sada ${kg(now)} ${unit}${h.length > 1 ? ` (${ch >= 0 ? "+" : ""}${ch} %)` : ""}</p>
      ${vals.length >= 2 ? chartSvg(vals) : ""}
      ${r ? `<p class="muted">Preporuka: ${esc(r.text)}</p>` : ""}
      ${h.slice(-3).reverse().map(([d, sets]) => `<p class="muted set-log">${fmtDate(d)}: ${describeSets(workingSets(sets), ex.timed)}</p>`).join("")}
    </section>`;
  }).join("");
}

function settingsView() {
  return `<button class="btn text" data-act="closeSettings">‹ Natrag</button>
    <h1>Postavke</h1>
    <button class="ov-row" data-act="openSetup"><span><strong>Plan i program</strong><br><span class="muted">Cilj, početak i kraj, broj i trajanje treninga, odmori, vježbe, tjelesna masa</span></span><span class="muted">›</span></button>
    <h2>Pregled</h2>
    <p class="muted">Ovo je web pregled Android aplikacije. Podaci ostaju samo u ovom pregledniku. Izvoz i uvoz datoteke postoje samo u Android aplikaciji.</p>
    <button class="btn secondary block" data-act="loadExample">Učitaj primjer podataka</button>
    <button class="btn secondary block danger" data-act="clearAll">Počni ispočetka (prazno)</button>`;
}

function render() {
  const main = $("#main"), focusId = document.activeElement && document.activeElement.id;
  const vals = {}; main.querySelectorAll("input[id]").forEach(i => { if (i.type !== "checkbox" && i.type !== "date") vals[i.id] = i.value; });
  const needsSetup = !state.selected.length;
  let html;
  if (ui.active) html = workoutView();
  else if (needsSetup || ui.editing) { if (!ui.setup) ui.setup = setupFrom(state); html = setupView(); }
  else if (ui.settings) html = settingsView();
  else html = { home: homeView, plan: planView, sessions: sessionsView, analysis: analysisView }[ui.tab]();
  main.innerHTML = html;
  // Polja koja je radnja upravo promijenila (nova serija, izmjereno vrijeme) dobivaju novi predupis.
  Object.entries(vals).forEach(([id, v]) => { const el = document.getElementById(id); if (el && !fresh.has(id)) el.value = v; });
  fresh.clear();
  if (focusId) { const el = document.getElementById(focusId); if (el) el.focus(); }
  $("#tabs").hidden = !!(ui.active || needsSetup || ui.editing || ui.settings);
  document.querySelectorAll("#tabs button").forEach(b => b.setAttribute("aria-current", b.dataset.tab === ui.tab ? "page" : "false"));
  $("#overlay").innerHTML = (ui.toast ? `<div class="toast" role="status">${esc(ui.toast)}</div>` : "") + (ui.dialog ? dialogHtml(ui.dialog) : "");
}

function startRest(a, entry, setsAfter, now) {
  const last = setsAfter >= SETS;
  a.timer = { kind: last ? "REST_EX" : "REST_SET", entry, startedAt: now, duration: last ? restEx(state) : restSets(state), signalled: false };
}

function setupFrom(d) {
  const g = GOALS[d.goal];
  return { goal: d.goal, days: d.daysPerWeek, minutes: d.durationMinutes, restSets: d.restSetsSec ?? g.restSets, restEx: d.restExercisesSec ?? g.restEx,
    startDay: d.startDay, endDay: d.endDay, bodyWeightKg: d.bodyWeightKg, selected: d.selected.slice(), pinned: (d.pinned || []).slice(), custom: d.customExercises.slice() };
}

function dialogHtml(dl) {
  if (dl.type === "confirm") return `<div class="dialog-back"><div class="dialog" role="dialog" aria-modal="true"><h3>${esc(dl.title)}</h3><p>${esc(dl.text)}</p>
    <div class="actions"><button class="btn text" data-act="dlgNo">${esc(dl.no || "Natrag")}</button><button class="btn" data-act="dlgYes">${esc(dl.yes)}</button></div></div></div>`;
  if (dl.type === "custom") return `<div class="dialog-back"><div class="dialog" role="dialog" aria-modal="true"><h3>Vlastita vježba – ${GROUP_LABEL[dl.group]}</h3>
    <label class="field">Naziv<input id="cx-name"></label>
    ${chips("cxKind", Object.keys(KINDS), dl.kind, k => KINDS[k][0])}
    ${dl.kind === "DUMBBELL" ? `<label class="check"><input type="checkbox" id="cx-pair" ${dl.pair !== false ? "checked" : ""}> Dvije bučice (računa se dvostruko)</label>` : ""}
    <label class="check"><input type="checkbox" id="cx-timed" ${dl.timed ? "checked" : ""}> Bilježi se u sekundama</label>
    <div class="actions"><button class="btn text" data-act="dlgNo">Odustani</button><button class="btn" data-act="cxSave">Dodaj</button></div></div></div>`;
  return "";
}

function ask(title, text, yes, onYes, no) { ui.dialog = { type: "confirm", title, text, yes, no, onYes }; render(); }

// ===== Radnje =====
document.addEventListener("click", (ev) => {
  const chip = ev.target.closest("[data-chip]");
  if (chip) return onChip(chip.dataset.chip, chip.dataset.value);
  const tab = ev.target.closest("#tabs [data-tab]");
  if (tab) { ui.tab = tab.dataset.tab; ui.week = null; ui.session = null; window.scrollTo(0, 0); render(); return; }
  const b = ev.target.closest("[data-act]"); if (!b) return;
  const act = b.dataset.act, i = Number(b.dataset.i), a = ui.active;
  const actions = {
    saveSetup() {
      const s = ui.setup, g = GOALS[s.goal];
      const bw = parseFloat(($("#bw")?.value || "").replace(",", "."));
      Object.assign(state, { goal: s.goal, daysPerWeek: s.days, durationMinutes: s.minutes, startDay: s.startDay, endDay: s.endDay,
        bodyWeightKg: bw > 20 && bw < 300 ? bw : s.bodyWeightKg,
        restSetsSec: s.restSets === g.restSets ? null : s.restSets, restExercisesSec: s.restEx === g.restEx ? null : s.restEx,
        selected: s.selected, pinned: s.pinned.filter(id => s.selected.includes(id)), customExercises: s.custom });
      persist(); ui.editing = false; ui.settings = false; ui.setup = null; ui.tab = "home"; ui.week = null; render();
    },
    cancelSetup() { ui.editing = false; ui.setup = null; render(); },
    openSettings() { ui.settings = true; window.scrollTo(0, 0); render(); },
    closeSettings() { ui.settings = false; render(); },
    openSetup() { ui.editing = true; ui.setup = setupFrom(state); window.scrollTo(0, 0); render(); },
    openSession() { ui.tab = "sessions"; ui.session = Number(b.dataset.id); window.scrollTo(0, 0); render(); },
    openSessionFromAnalysis() { ui.tab = "sessions"; ui.session = Number(b.dataset.id); window.scrollTo(0, 0); render(); },
    closeSession() { ui.session = null; render(); },
    anMode() { ui.analysis = b.dataset.m; render(); },
    stepBw() { const el = $("#bw"), cur = parseFloat((el.value || "0").replace(",", ".")); el.value = kg(Math.max(30, (isNaN(cur) ? 80 : cur) + Number(b.dataset.d))); },
    resetRest() { const g = GOALS[ui.setup.goal]; ui.setup.restSets = g.restSets; ui.setup.restEx = g.restEx; render(); },
    addCustom() { ui.dialog = { type: "custom", group: b.dataset.group, kind: "DUMBBELL", timed: false }; render(); },
    cxSave() {
      const name = $("#cx-name").value.trim(); if (!name) return;
      const ex = { id: "custom_" + Date.now(), name, group: ui.dialog.group, kind: ui.dialog.kind, timed: $("#cx-timed").checked,
        pair: ui.dialog.kind === "DUMBBELL" ? $("#cx-pair").checked : false };
      ui.setup.custom.push(ex); ui.setup.selected.push(ex.id); ui.dialog = null; render();
    },
    pin() { const id = b.dataset.id, p = ui.setup.pinned; ui.setup.pinned = p.includes(id) ? p.filter(x => x !== id) : p.concat(id); render(); },
    stepReps() {
      const el = $("#r-" + i), d = Number(b.dataset.d), cur = parseInt(el.value, 10);
      el.value = String(Math.max(1, (isNaN(cur) ? 0 : cur) + d));
    },
    dlgNo() { ui.dialog = null; render(); },
    dlgYes() { const f = ui.dialog.onYes; ui.dialog = null; f(); render(); },
    weekPrev() { ui.week = Math.max(0, (ui.week ?? Math.max(0, weekOf(today()))) - 1); render(); },
    weekNext() { const lw = lastWeek(); ui.week = Math.min((ui.week ?? Math.max(0, weekOf(today()))) + 1, lw ?? Infinity); render(); },
    reshuffle() { const w = Number(b.dataset.w); state.salts[w] = (state.salts[w] || 0) + 1; persist(); toast("Treninzi su promiješani."); },
    start() {
      const w = Number(b.dataset.w), k = Number(b.dataset.k), ids = (planForWeek(w).days[k] || []).filter(id => cat().get(id));
      if (!ids.length) { toast("Ovaj trening nema vježbi – odaberite vježbe u postavkama."); return; }
      ui.active = { name: `Tjedan ${w + 1} · Trening ${letter(k)}`, plannedDay: dayDate(w, k), startedAt: Date.now(),
        entries: ids.map(id => ({ exerciseId: id, sets: [] })), order: ids.map((_, n) => n), pos: 0, view: "exercise", timer: null, pending: null };
      keepAwake(true); render();
    },
    startSet() {
      // Neupisana serija druge vježbe: vrati korisnika na nju umjesto da se izmjereno vrijeme izgubi.
      if (a.pending && a.pending.entry !== i) { a.pos = a.order.indexOf(a.pending.entry); toast("Prvo upišite rezultat prethodne serije."); return; }
      beepPrime(); a.timer = { kind: "WORK", entry: i, startedAt: Date.now() }; a.pending = null; render();
    },
    endSet() {
      const t = a.timer, now = Date.now();
      a.pending = { entry: t.entry, workSeconds: Math.floor((now - t.startedAt) / 1000) };
      startRest(a, t.entry, a.entries[t.entry].sets.length + 1, now);
      fresh.add("r-" + t.entry); render();
    },
    saveSet() {
      const ex = cat().get(a.entries[i].exerciseId), wEl = $("#w-" + i), rEl = $("#r-" + i);
      const reps = parseInt(rEl.value, 10), w = wEl ? parseFloat(wEl.value.replace(",", ".")) : null;
      if (!(reps > 0) || (wEl && !(w >= 0))) { toast("Upišite " + (wEl ? "težinu i " : "") + (ex.timed ? "sekunde." : "ponavljanja.")); return; }
      const work = a.pending && a.pending.entry === i ? a.pending.workSeconds : null;
      a.entries[i].sets.push({ weightKg: wEl ? w : null, reps, workSeconds: work });
      a.pending = null;
      if (work == null) startRest(a, i, a.entries[i].sets.length, Date.now()); // serija upisana bez štoperice
      fresh.add("r-" + i);
      // Nakon zadnje serije: sam prelazi na sljedeću vježbu (odmor između vježbi teče dalje).
      if (a.entries[i].sets.length === SETS) { const np = nextUndone(a); if (np == null) a.view = "summary"; else a.pos = np; }
      render();
    },
    undoSet() { a.entries[i].sets.pop(); if (a.pending && a.pending.entry === i) a.pending = null; render(); },
    stepW() { const el = $("#w-" + i), cur = parseFloat((el.value || "0").replace(",", ".")); el.value = kg(Math.max(0, Math.round(((isNaN(cur) ? 0 : cur) + Number(b.dataset.d)) * 100) / 100)); },
    goNext() { const np = nextUndone(a); if (np == null) a.view = "summary"; else a.pos = np; render(); },
    goPrev() { a.pos = Math.max(0, a.pos - 1); render(); },
    goNextPos() { a.pos = Math.min(a.order.length - 1, a.pos + 1); render(); },
    later() { // trenutnu vježbu premjesti na kraj redoslijeda
      const idx = a.order.splice(a.pos, 1)[0]; a.order.push(idx);
      a.pos = Math.min(a.pos, a.order.length - 1);
      const here = a.order[a.pos];
      if (here === idx || entryDone(a.entries[here])) { const np = nextUndone(a); if (np != null) a.pos = np; }
      toast("Vježba premještena na kraj."); render();
    },
    overview() { a.view = "overview"; render(); },
    jump() { a.pos = Number(b.dataset.p); a.view = "exercise"; render(); },
    backToEx() { a.view = "exercise"; render(); },
    toSummary() { a.view = "summary"; render(); },
    saveWorkout() {
      const entries = a.entries.filter(e => e.sets.length);
      if (entries.length) { state.sessions.push({ id: Date.now(), epochDay: today(), plannedDay: a.plannedDay, workoutName: a.name, entries,
        durationSeconds: Math.floor((Date.now() - a.startedAt) / 1000) }); persist(); }
      ui.active = null; keepAwake(false); ui.tab = "home"; toast(entries.length ? "Trening spremljen." : "Ništa nije upisano – trening nije spremljen.");
    },
    cancelWorkout() { ask("Odbaciti trening?", "Upisane serije neće biti spremljene.", "Odbaci", () => { ui.active = null; keepAwake(false); }, "Natrag"); },
    deleteSession() { const id = Number(b.dataset.id); ask("Obrisati trening?", "Brisanje se ne može poništiti.", "Obriši", () => { state.sessions = state.sessions.filter(s => s.id !== id); persist(); ui.session = null; }); },

    loadExample() { ask("Učitati primjer?", "Trenutni podaci u ovom pregledniku zamijenit će se primjerom.", "Učitaj", () => { state = exampleData(); persist(); ui.week = null; ui.settings = false; ui.tab = "home"; }); },
    clearAll() { ask("Početi ispočetka?", "Brišu se plan i svi treninzi u ovom pregledniku.", "Obriši sve", () => { state = emptyState(); persist(); ui.setup = null; ui.week = null; ui.settings = false; ui.tab = "home"; }); },
  };
  if (actions[act]) actions[act]();
});

document.addEventListener("change", (ev) => {
  const el = ev.target;
  if (el.id === "start-date" && ui.setup && el.value) {
    const s = ui.setup, len = s.endDay != null ? s.endDay - s.startDay : null; // zadrži trajanje programa
    s.startDay = fromIso(el.value); if (len != null) s.endDay = s.startDay + len; render(); return;
  }
  if (el.id === "end-date" && ui.setup) { ui.setup.endDay = el.value ? fromIso(el.value) : null; render(); return; }
  const sel = el.dataset && el.dataset.sel;
  if (sel && ui.setup) {
    const s = ui.setup.selected;
    if (el.checked) { if (!s.includes(sel)) s.push(sel); } else { ui.setup.selected = s.filter(x => x !== sel); ui.setup.pinned = ui.setup.pinned.filter(x => x !== sel); }
    render();
  }
});

function onChip(name, value) {
  if (name === "cxKind") { ui.dialog.timed = $("#cx-timed").checked; if ($("#cx-pair")) ui.dialog.pair = $("#cx-pair").checked; const n = $("#cx-name").value; ui.dialog.kind = value; render(); $("#cx-name").value = n; return; }
  const s = ui.setup; if (!s) return;
  if (name === "goal") {
    const old = GOALS[s.goal], g = GOALS[value];
    if (s.restSets === old.restSets) s.restSets = g.restSets;
    if (s.restEx === old.restEx) s.restEx = g.restEx;
    s.goal = value;
  } else if (name === "restSets") s.restSets = Number(value);
  else if (name === "restEx") s.restEx = Number(value);
  else if (name === "days") s.days = Number(value);
  else if (name === "weeks") s.endDay = Number(value) ? s.startDay + Number(value) * 7 - 1 : null;
  else if (name === "minutes") s.minutes = Number(value);
  render();
}

// Otkucaj štoperice: osvježava samo ploču, a signal daje jednom kad odmor istekne.
setInterval(() => {
  const a = ui.active; if (!a) return;
  const t = a.timer;
  if (t && t.kind !== "WORK" && !t.signalled && Date.now() >= t.startedAt + t.duration * 1000) { t.signalled = true; beep(); }
  if (ui.dialog) return;
  const tmp = document.createElement("div"); tmp.innerHTML = workoutView();
  [".timer", ".wk-head .total"].forEach(sel => { const old = document.querySelector(sel), nw = tmp.querySelector(sel); if (old && nw) old.replaceWith(nw); });
}, 250);
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && ui.active) { wakeLock = null; keepAwake(true); } });

render();
</script>
